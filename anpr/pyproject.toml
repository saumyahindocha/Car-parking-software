[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr-service"
version = "0.1.0"
description = "ANPR edge service for the railway-station parking lot (bikes now, cars later)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = ["onnxruntime-gpu>=1.17"]
fast = ["scipy>=1.11"]
dev = ["pytest>=8"]

[project.scripts]
anpr-service = "anpr_service.cli:main"

[tool.setuptools.packages.find]
include = ["anpr_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end tests that render and process video"]
