# Edge server stack (Ubuntu 24.04). Everything that records entries/exits runs here and keeps
# working without internet. Start with ./install.sh, or:  docker compose up -d
# CPU only by default (our plate models run on the CPU). With an NVIDIA GPU, install.sh adds
# docker-compose.gpu.yml through COMPOSE_FILE in .env.
name: parking

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Kolkata
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-2GB}", "-c", "effective_cache_size=${PG_CACHE_SIZE:-8GB}", "-c", "max_connections=100",
              "-c", "wal_compression=on", "-c", "checkpoint_timeout=15min"]
    volumes:
      - ${PG_DATA_DIR:-/srv/parking/pgdata}:/var/lib/postgresql/data     # NVMe
    ports:
      - "127.0.0.1:5432:5432"          # host-side backup/restore scripts only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: parking-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PARK_DATABASE_URL: postgresql+psycopg://parking:${DB_PASSWORD}@db:5432/parking
      PARK_IMAGE_ROOT: /data/images
      PARK_UPLOAD_ROOT: /data/uploads
      PARK_WORKER_WEB_DIST: /app/worker_web
      TZ: Asia/Kolkata
    volumes:
      - ${IMAGE_DIR:-/srv/parking/images}:/data/images                # 4 TB HDD
      - ${UPLOAD_DIR:-/srv/parking/uploads}:/data/uploads
      - ${WORKER_WEB_DIR:-/srv/parking/worker-web}:/app/worker_web:ro # phone app (install.sh downloads it)
    ports:
      - "127.0.0.1:8000:8000"          # host-local only; the LAN reaches it through the HTTPS gateway
    stop_grace_period: 20s

  gateway:
    # Site HTTPS gateway (Caddy): https://<edge IP> for phones, dashboard PC and alert units.
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PARK_SITE_IP: ${PARK_SITE_IP:?set PARK_SITE_IP (the edge server's LAN IP) in .env}
      PARK_SITE_HOSTNAME: ${PARK_SITE_HOSTNAME:-parking.local}
    ports:
      - "80:80"                        # only serves /site-ca.crt and redirects to HTTPS
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-/srv/parking/caddy}:/data          # the site CA lives here: back it up
      - ${CADDY_CERTS_DIR:-/srv/parking/certs}:/certs:ro      # optional own certificates

  anpr:
    build:
      context: ../anpr
      args:
        BASE_IMAGE: ubuntu:24.04
        ONNX_PACKAGE: onnxruntime
    image: parking-anpr:latest
    user: "1001"          # same user as the backend: it deletes old plate images (privacy retention)
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      ANPR_API_KEY: ${PARK_ANPR_API_KEY}
      IMAGE_ROOT: /data/images
      ANPR_OUTBOX: /data/anpr/outbox.sqlite
      TZ: Asia/Kolkata
    volumes:
      - ./config/site.yaml:/config/site.yaml:ro
      - ${IMAGE_DIR:-/srv/parking/images}:/data/images
      - ${ANPR_STATE_DIR:-/srv/parking/anpr}:/data/anpr               # durable event outbox
      - ${MODEL_DIR:-/srv/parking/models}:/models:ro
