# Builds the worker Android app (APK) on GitHub's servers — no Android SDK needed locally.
# Download: repository → Actions → "Worker app APK" → latest run → Artifacts → parking-worker-apk
name: Worker app APK

on:
  push:
    paths:
      - "worker_app/**"
      - ".github/workflows/worker-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK (release, signed with the debug key for sideloading)
        run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "parking-worker-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: parking-worker-apk
          path: worker_app/parking-worker-*.apk
          retention-days: 30
