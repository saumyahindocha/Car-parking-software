<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Collect parking fees, passes and cash handovers">
  <meta name="theme-color" content="#1665d8">

  <!-- Add to Home Screen (iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Parking">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Parking Worker</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; font-family: -apple-system, system-ui, sans-serif; color: #1f2937; }
    #splash .logo { width: 72px; height: 72px; border-radius: 18px; background: #1665d8; color: #fff;
                    font: 700 42px/72px -apple-system, system-ui, sans-serif; text-align: center; }
    #splash p { margin-top: 16px; font-size: 15px; color: #6b7280; }
  </style>
</head>
<body>
  <div id="splash"><div class="logo">P</div><p>Loading Parking Worker…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
