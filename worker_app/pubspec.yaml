name: parking_worker
description: "Parking Worker: Android app for floor workers, guards and supervisors of the station ANPR parking lot."
publish_to: 'none'
version: 1.0.0+1

# Built and tested with Flutter 3.47.5 / Dart 3.13.4 (stable, Sept 2026).
# Versions are caret-pinned; pubspec.lock is committed so every APK build
# resolves exactly the same packages.
environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # networking
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1
  # state
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  # offline queue + cache
  sqflite: ^2.4.4
  path: ^1.9.1
  uuid: ^4.6.0
  # QR codes (UPI + receipts), camera photos, on-device plate OCR
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  intl: ^0.20.3
  sqflite_common_ffi_web: ^1.2.0
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
