{% extends "base.html" %}
{% block content %}
<h1>{% if next == 'pass' %}{{ t('pass_title') }}{% elif next == 'privacy' %}{{ t('data_request_title') }}{% else %}{{ t('dues_title') }}{% endif %}</h1>
<h2>{{ t('verify_title') }}</h2>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/otp/send" autocomplete="on">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="plate">{{ t('vehicle_number') }}</label>
  <input id="plate" name="plate" autocapitalize="characters" spellcheck="false" maxlength="14" value="{{ plate }}"
         placeholder="{{ t('plate_ph') }}" required>
  <label for="phone">{{ t('mobile') }}</label>
  <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14"
         placeholder="98XXXXXXXX" required>
  <p class="meta">{{ t('otp_consent') }}</p>
  <button type="submit" class="primary">{{ t('send_otp') }}</button>
</form>
{% endblock %}
