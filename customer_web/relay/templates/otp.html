{% extends "base.html" %}
{% block content %}
<h1>{{ t('enter_otp') }}</h1>
<p>{{ t('otp_sent', phone=phone_masked) }}</p>
{% if demo_code %}<p class="demo-banner">Demo OTP: <b>{{ demo_code }}</b></p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/otp/verify" autocomplete="off">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf }}">
  <label for="code">{{ t('enter_otp') }}</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required class="otp">
  <button type="submit" class="primary">{{ t('verify') }}</button>
</form>
<p><a href="/verify?next={{ next }}">{{ t('resend') }}</a></p>
{% endblock %}
