{% extends "base.html" %}
{% block content %}
<h1>{{ t('dispute_title') }}</h1>
<p class="plate big">{{ plate_shown }}</p>
<p>{{ t('dispute_intro') }}</p>
<form method="post" action="/dues/dispute">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf }}">
  <label for="date">{{ t('date') }}</label>
  <input id="date" name="date" type="date" max="{{ today }}" value="{{ today }}" required>
  <label for="time">{{ t('approx_time') }}</label>
  <input id="time" name="time" type="time" value="09:00">
  <label for="amount">{{ t('amount_rs') }}</label>
  <input id="amount" name="amount" type="number" inputmode="decimal" min="1" max="10000" step="1"{% if due > 0 %} value="{{ (due / 100) | int }}"{% endif %}>
  <fieldset><legend>{{ t('mode') }}</legend>
    <label class="opt"><input type="radio" name="mode" value="CASH" checked> <span>{{ t('cash') }}</span></label>
    <label class="opt"><input type="radio" name="mode" value="UPI"> <span>{{ t('upi') }}</span></label>
  </fieldset>
  <label for="note">{{ t('note') }}</label>
  <textarea id="note" name="note" rows="3" maxlength="500"></textarea>
  <button type="submit" class="primary">{{ t('submit') }}</button>
</form>
{% endblock %}
